name: ariha_rh_system

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ariha_dev
      POSTGRES_USER: ariha
      POSTGRES_PASSWORD: ariha_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariha -d ariha_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
